spring:
  application:
    name: iboot-iprint

  # MySQL 数据源
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/iboot_iprint?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Jackson 序列化配置
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080
  servlet:
    context-path: /

demo-mode:
  enabled: true
  blocked:
    - method: PUT
      path: /api/users/{id}
    - method: DELETE
      path: /api/users/{id}

logging:
  level:
    root: INFO
    com.iboot.iprint: DEBUG

iprint:
  render:
    htmlunit:
      initial-wait-ms: 200
      ready-timeout-ms: 3000
      ready-poll-ms: 50
    page-pool:
      enabled: true
      size: 2
      borrow-timeout-ms: 1000
      max-uses-per-page: 200
    pdf:
      javascript-delay-ms: 100
